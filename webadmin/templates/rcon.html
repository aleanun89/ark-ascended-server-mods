<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Administración RCON ARK ASA</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div class="container py-5">
        <h2>Comandos RCON</h2>
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <div class="alert alert-info">{{ messages[0] }}</div>
          {% endif %}
        {% endwith %}
        <form method="post" action="{{ url_for('send_rcon') }}">
            <div class="mb-3">
                <input type="text" name="command" class="form-control" placeholder="Comando RCON personalizado">
            </div>
            <button type="submit" class="btn btn-primary">Enviar comando</button>
        </form>
        <hr>
        <form method="post" action="{{ url_for('save_world') }}" style="display:inline;">
            <button type="submit" class="btn btn-success">Guardar mundo</button>
        </form>
        <form method="post" action="{{ url_for('restart_server') }}" style="display:inline;">
            <button type="submit" class="btn btn-danger">Reiniciar servidor</button>
        </form>
        <form method="post" action="{{ url_for('restart_map_route') }}" style="display:inline;">
            <button type="submit" class="btn btn-warning">Reiniciar mapa y recargar .ini</button>
        </form>
        <hr>
        <a href="/" class="btn btn-secondary">Volver</a>
    </div>
</body>
</html>
