<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Backups ARK ASA</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div class="container py-5">
        <h2>Backups de mapas y archivos guardados</h2>
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <div class="alert alert-success">{{ messages[0] }}</div>
          {% endif %}
        {% endwith %}
        <form method="post" action="{{ url_for('create_backup') }}">
            <button type="submit" class="btn btn-primary mb-3">Crear Backup</button>
        </form>
        <h4>Backups disponibles:</h4>
        <ul class="list-group mb-3">
            {% for backup in backups %}
            <li class="list-group-item d-flex justify-content-between align-items-center">
                {{ backup }}
                <form method="post" action="{{ url_for('restore_backup', backup_name=backup) }}" style="display:inline;">
                    <button type="submit" class="btn btn-sm btn-warning">Restaurar</button>
                </form>
            </li>
            {% else %}
            <li class="list-group-item">No hay backups disponibles.</li>
            {% endfor %}
        </ul>
        <a href="/" class="btn btn-secondary">Volver</a>
    </div>
</body>
</html>
